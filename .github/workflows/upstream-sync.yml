name: Sync upstream
on:
  schedule:
    - cron: '0 4 * * *'  # 每天北京时间 12:00 检查一次
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anthropics/claude-plugins-official.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          # 检查上游最新 commit 是否已经在我们的 main 中
          if git merge-base --is-ancestor $UPSTREAM_SHA HEAD; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New upstream commits detected!"
            # 获取新增的 commit 摘要
            CHANGES=$(git log HEAD..upstream/main --oneline | head -20)
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.has_updates == 'true'
        id: pr
        env:
          PAT: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="upstream-sync-$(date +%Y%m%d)"
          git checkout -b $BRANCH

          # 配置 committer identity（merge 必须）
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          CONFLICT=""
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded cleanly"

            # Bump telegram plugin patch version
            cat > /tmp/bump_version.py << 'PYEOF'
            import json, pathlib
            pkg_path = pathlib.Path('external_plugins/telegram/package.json')
            plugin_path = pathlib.Path('external_plugins/telegram/.claude-plugin/plugin.json')
            pkg = json.loads(pkg_path.read_text())
            parts = pkg['version'].split('.')
            parts[2] = str(int(parts[2]) + 1)
            new_ver = '.'.join(parts)
            pkg['version'] = new_ver
            pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')
            plugin = json.loads(plugin_path.read_text())
            plugin['version'] = new_ver
            plugin_path.write_text(json.dumps(plugin, indent=2) + '\n')
            print(f'Bumped version to {new_ver}')
            PYEOF
            python3 /tmp/bump_version.py
            NEW_VER=$(python3 -c "import json; print(json.load(open('external_plugins/telegram/package.json'))['version'])")
            git add external_plugins/telegram/package.json external_plugins/telegram/.claude-plugin/plugin.json
            git commit -m "chore: bump telegram plugin version to ${NEW_VER}"
          else
            # 有冲突：记录并提交冲突状态
            CONFLICT="⚠️ 有合并冲突需要手动解决"
            echo "Merge conflicts detected, committing conflict state"
            git add -A
            git commit -m "sync: merge upstream with conflicts (manual resolution needed)"
          fi

          git push origin $BRANCH

          # 使用 REST API 创建 PR（fine-grained PAT 不支持 GraphQL，但支持 REST）
          CHANGES="${{ steps.check.outputs.changes }}"
          PR_BODY="## Upstream Changes

          ${CHANGES}

          ${CONFLICT}

          Auto-synced from anthropics/claude-plugins-official"

          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "{
              \"title\": \"🔄 Sync upstream $(date +%Y-%m-%d)\",
              \"body\": $(echo "$PR_BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }")

          PR_URL=$(echo "$PR_RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("html_url","ERROR: "+str(d.get("message","unknown"))))')
          echo "PR URL: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Notify via Telegram
        if: steps.check.outputs.has_updates == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: 6629257152
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          CHANGES="${{ steps.check.outputs.changes }}"
          MESSAGE="🔔 Claude Plugins 上游有更新！

          📝 变更：
          ${CHANGES}

          👉 PR: ${PR_URL}"

          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true"
