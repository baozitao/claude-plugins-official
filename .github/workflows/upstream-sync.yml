name: Sync upstream
on:
  schedule:
    - cron: '0 4 * * *'  # 每天北京时间 12:00 检查一次
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anthropics/claude-plugins-official.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          # 检查上游最新 commit 是否已经在我们的 main 中
          if git merge-base --is-ancestor $UPSTREAM_SHA HEAD; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New upstream commits detected!"
          fi

      - name: Merge upstream and push to main
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # 配置 committer identity
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # 记录 merge 前的 HEAD，用于之后获取变更日志
          OLD_HEAD=$(git rev-parse HEAD)

          if git merge upstream/main --no-edit; then
            echo "Merge succeeded cleanly"

            # 获取本次 sync 包含的所有上游提交日志（排除 bump 提交）
            CHANGES_RAW=$(git log ${OLD_HEAD}..HEAD --oneline | grep -v 'chore: bump' | head -20)
            # 每行加上 "- " 前缀
            CHANGES_FORMATTED=$(echo "$CHANGES_RAW" | sed 's/^/- /')

            # Bump telegram plugin patch version
            echo '' | base64 -d > /tmp/bump_version.py
            python3 /tmp/bump_version.py
            NEW_VER=$(python3 -c "import json; print(json.load(open('external_plugins/telegram/package.json'))['version'])")
            git add external_plugins/telegram/package.json external_plugins/telegram/.claude-plugin/plugin.json
            git commit -m "chore: bump telegram plugin version to ${NEW_VER}"

            # 直接推送到 main
            git push origin main
            echo "merge_status=success" >> $GITHUB_OUTPUT
            echo "new_version=${NEW_VER}" >> $GITHUB_OUTPUT
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES_FORMATTED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            # 有冲突：终止 merge，记录状态，不推送
            CHANGES_RAW=$(git log HEAD..upstream/main --oneline | head -20)
            CHANGES_FORMATTED=$(echo "$CHANGES_RAW" | sed 's/^/- /')
            git merge --abort
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            echo "Merge conflicts detected, skipping push"
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES_FORMATTED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Notify via Telegram (success)
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_status == 'success'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: 6629257152
        run: |
          CHANGES="${{ steps.merge.outputs.changes }}"
          NEW_VER="${{ steps.merge.outputs.new_version }}"
          MESSAGE="✅ Upstream sync 成功

版本: ${NEW_VER}

变更日志:
${CHANGES}"

          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Notify via Telegram (conflict)
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_status == 'conflict'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: 6629257152
        run: |
          CHANGES="${{ steps.merge.outputs.changes }}"
          MESSAGE="⚠️ Upstream sync 失败：有合并冲突！

上游变更日志:
${CHANGES}

需要手动处理冲突后推送到 main 分支
仓库：https://github.com/${{ github.repository }}"

          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
